<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dawnspire Brand Assets</title>
<link rel="icon" type="image/svg+xml" href="/brand/dawnspire-favicon.svg">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--ink:#181a1b;--paper:#f5f5f2;--signal:#f14b28;--line:#d9dad6}
*{box-sizing:border-box}
body{margin:0;font-family:'Barlow',sans-serif;background:var(--paper);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 5%;border-bottom:1px solid var(--line)}
h1{margin:0;font:800 28px/1 'Barlow Condensed',sans-serif;letter-spacing:-.02em;text-transform:uppercase}
button{font:600 13px 'Barlow',sans-serif;letter-spacing:.06em;text-transform:uppercase;border:0;background:var(--signal);color:#fff;padding:12px 18px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr}
.panel{padding:48px 5%;display:flex;flex-direction:column;gap:40px;min-width:0}
.panel.dark{background:var(--ink);color:var(--paper)}
.label{font:600 11px 'Barlow',sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:14px}
.panel img{display:block;max-width:100%;height:auto}
.sizes{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
/* The favicon follows the browser theme, not the page, so show it on a tab-coloured chip that does the same. */
.tab-chip{display:flex;align-items:flex-end;gap:24px;width:max-content;padding:14px 18px;background:#ffffff;border:1px solid var(--line)}
@media(prefers-color-scheme:dark){.tab-chip{background:#202124;border-color:#3c4043}}
.note{font-size:12px;opacity:.6;margin-top:10px}
@media(max-width:760px){.row{grid-template-columns:1fr}header{padding:20px 16px}.panel{padding:32px 16px}}
</style>
</head>
<body>
<header><h1>Dawnspire brand assets</h1><button id="replay" type="button">Replay animations</button></header>
<div class="row" id="panels"></div>
<script>
// Dev-only preview of public/brand. Not part of the site build or the Drive folder.
const sections = [
  ['Mark — animated', 'mark-animated', 240],
  ['Lockup — animated', 'lockup-animated', 560],
  ['Stacked lockup — animated', 'lockup-stacked-animated', 340],
  ['Mark — static', 'mark', 160],
  ['Lockup — static', 'lockup', 480],
  ['Stacked lockup — static', 'lockup-stacked', 300],
];
const panels = document.getElementById('panels');
for (const mode of ['light', 'dark']) {
  const panel = document.createElement('section');
  panel.className = 'panel' + (mode === 'dark' ? ' dark' : '');
  panel.setAttribute('aria-label', mode === 'dark' ? 'Dark mode' : 'Light mode');
  let html = sections.map(([label, name, w]) =>
    `<div><div class="label">${label}</div><img${name.includes('animated') ? ' class="anim"' : ''} src="/brand/dawnspire-${name}-${mode}.svg" width="${w}" alt="${label}"></div>`).join('');
  const s = n => `<img src="/brand/dawnspire-${n}-${mode}.svg" width`;
  html += `<div><div class="label">Scale check</div><div class="sizes">${s('mark')}="16" alt=""><img src="/brand/dawnspire-mark-${mode}.svg" width="32" alt="">${s('mark')}="64" alt="">${s('lockup')}="120" alt="">${s('lockup-stacked')}="90" alt="">${s('lockup-stacked')}="160" alt=""></div></div>`;
  html += `<div><div class="label">Favicon</div><div class="tab-chip"><img src="/brand/dawnspire-favicon.svg" width="16" alt=""><img src="/brand/dawnspire-favicon.svg" width="32" alt=""><img src="/brand/dawnspire-favicon.svg" width="64" alt=""></div><p class="note">Follows the browser theme, shown on a matching tab colour.</p></div>`;
  panel.innerHTML = html;
  panels.append(panel);
}
document.getElementById('replay').addEventListener('click', () => {
  const t = Date.now();
  document.querySelectorAll('img.anim').forEach(i => { i.src = i.src.split('?')[0] + '?r=' + t; });
});
</script>
</body>
</html>
