@keyframes in-side{from{transform:translate(40px,-40px);opacity:0}45%{opacity:1}to{transform:none;opacity:1}}
.g{animation:rise .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.95s + var(--i) * 45ms)}
.inc{animation:fade .5s ease-out 1.5s both}
