<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 240 200" width="240" height="200" role="img" aria-labelledby="t">
<title id="t">Dawnspire mark, animated, for light backgrounds</title>
<style>.stairs{animation:in-stairs .95s cubic-bezier(.16,1,.3,1) .1s both}.side{animation:in-side .95s cubic-bezier(.16,1,.3,1) .22s both}
@keyframes in-stairs{from{transform:translate(-40px,40px);opacity:0}45%{opacity:1}to{transform:none;opacity:1}}
@keyframes in-side{from{transform:translate(40px,-40px);opacity:0}45%{opacity:1}to{transform:none;opacity:1}}@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}</style>
<path class="stairs" fill="#181a1b" d="M0 120V80H40V40H80V0H120L120.5 0.5H159.5V79.793L120 119.293V120Z"/>
<path class="side" fill="#f14b28" d="M80 40L120 0H160V80L120 120V40Z"/>
</svg>
